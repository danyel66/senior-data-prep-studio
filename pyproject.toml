[project]
name = "senior-data-prep-studio"
version = "0.4.0"
description = "Desktop studio for senior-level SQL / Python / Analytics Engineering practice."
requires-python = ">=3.11"
dependencies = ["PyQt6>=6.6", "duckdb>=1.3", "psutil>=5.9", "anthropic>=2.5", "keyring>=25", "pandas>=2.2", "numpy>=1.26", "pytz"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8"]

[project.scripts]
sdps = "sdps.app:main"

[tool.setuptools.packages.find]
include = ["sdps*"]

[tool.setuptools.package-data]
"sdps.db" = ["sql/*.sql"]
